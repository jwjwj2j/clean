name: Build-Release

on:
  push:
    tags:
      - v*

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: write clean keystore
        run: echo ${{ secrets.GKD_STORE_FILE_BASE64 }} | base64 --decode > ${{ github.workspace }}/clean.jks

      # 单变体化：原 gkd / play 两个 flavor 已合并，play 渠道与 PLAY_* 签名一并移除。
      - run: ./gradlew :clean-app:assembleRelease
        env:
          GKD_STORE_FILE: ${{ github.workspace }}/clean.jks
          GKD_STORE_PASSWORD: ${{ secrets.GKD_STORE_PASSWORD }}
          GKD_KEY_ALIAS: ${{ secrets.GKD_KEY_ALIAS }}
          GKD_KEY_PASSWORD: ${{ secrets.GKD_KEY_PASSWORD }}
          GKD_RENAME_APK_FLAG: "1"

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: clean-app/build/outputs/apk/release

      - uses: actions/upload-artifact@v7
        with:
          name: outputs
          path: clean-app/build/outputs

      - run: |
          cp outputs/apk/release/*.apk "${GITHUB_WORKSPACE}/clean-${GITHUB_REF_NAME}.apk"
          zip -r "${GITHUB_WORKSPACE}/outputs-${GITHUB_REF_NAME}.zip" outputs
        working-directory: clean-app/build

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: ./CHANGELOG.md
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          fail_on_unmatched_files: true
          files: |
            clean-*.apk
            outputs-*.zip
